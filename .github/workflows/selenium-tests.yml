name: Gradewallah Selenium Tests

# Runs the full Selenium suite against your deployed site:
#   - on every push/PR to main (catches regressions before merge)
#   - on a daily schedule (catches things breaking silently, e.g. Clerk/
#     Supabase config drift, a dependency update, a live-content change)
#   - manually, any time, via the "Run workflow" button in the Actions tab
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run public-page tests (no login required)
        env:
          GRADEWALLAH_URL: ${{ secrets.GRADEWALLAH_URL }}
        run: python3 -m unittest test_login test_auth_guard -v

      - name: Run authenticated-page tests
        env:
          GRADEWALLAH_URL: ${{ secrets.GRADEWALLAH_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}                       # real inbox, no "+clerk_test" — this suite runs against production
          TEST_EMAIL_IMAP_USER: ${{ secrets.TEST_EMAIL_IMAP_USER }}   # usually same as TEST_EMAIL
          TEST_EMAIL_IMAP_PASSWORD: ${{ secrets.TEST_EMAIL_IMAP_PASSWORD }}   # Gmail App Password, NOT your normal password
          TEST_ROLL: ${{ secrets.TEST_ROLL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}   # Dashboard -> API Keys -> Secret key (sk_...) — bypasses CAPTCHA in headless CI
        run: |
          python3 -m unittest test_dashboard -v
          python3 -m unittest test_grades -v
          python3 -m unittest test_analyser -v
          python3 -m unittest test_resources -v
          python3 -m unittest test_internships -v
          python3 -m unittest test_placements -v
          python3 -m unittest test_dsatracker -v

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: e2e-tests/screenshots/
          retention-days: 7

# ============================================================
# One-time setup needed in your GitHub repo before this will run:
#   Settings → Secrets and variables → Actions → New repository secret
#     GRADEWALLAH_URL            e.g. https://gradewallah.com
#     TEST_EMAIL                 a REAL inbox you control, no "+clerk_test"
#                                 (this suite runs against production —
#                                 see common.py's module docstring for why)
#     TEST_EMAIL_IMAP_USER       usually same as TEST_EMAIL
#     TEST_EMAIL_IMAP_PASSWORD   an App Password for that inbox — for
#                                 Gmail: Google Account -> Security ->
#                                 App passwords (2-Step Verification must
#                                 be on first). NOT your normal password.
#     TEST_ROLL                  e.g. 2300100300001
#     CLERK_SECRET_KEY           from Clerk Dashboard -> API Keys -> Secret key
#                                 (starts with sk_). Needed to bypass CAPTCHA/
#                                 bot-detection in headless CI — without it,
#                                 sign-up will fail showing "Error loading CAPTCHA".
# Without these secrets set, the workflow will run but the authenticated
# tests will fail at sign-up (empty email/URL, blocked by CAPTCHA, or no
# way to read the real verification code Clerk sends).
# ============================================================
